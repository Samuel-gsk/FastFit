<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - FastFit</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>FastFit</h1>

            <h2>Criar Conta</h2>

            <p>
                Cadastre-se gratuitamente.
            </p>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
            >

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
            >

            <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
            >

            <button onclick="cadastrar()">
                Cadastrar
            </button>

            <div class="auth-link">

                Já possui conta?

                <a href="login.html">
                    Entrar
                </a>

            </div>

        </div>

    </div>

    <script src="cadastro.js"></script>

</body>

</html>
