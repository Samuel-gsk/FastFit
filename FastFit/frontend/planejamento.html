<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Planejamento</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>📅 Planejamento Semanal</h1>

    <div id="planejamento">

        <div class="dia">
            <h3>Segunda</h3>
            <select id="Segunda"></select>
        </div>

        <div class="dia">
            <h3>Terça</h3>
            <select id="Terca"></select>
        </div>

        <div class="dia">
            <h3>Quarta</h3>
            <select id="Quarta"></select>
        </div>

        <div class="dia">
            <h3>Quinta</h3>
            <select id="Quinta"></select>
        </div>

        <div class="dia">
            <h3>Sexta</h3>
            <select id="Sexta"></select>
        </div>

        <div class="dia">
            <h3>Sábado</h3>
            <select id="Sabado"></select>
        </div>

        <div class="dia">
            <h3>Domingo</h3>
            <select id="Domingo"></select>
        </div>

    </div>

    <button onclick="salvarPlanejamento()">
        Salvar Planejamento
    </button>

    <script src="planejamento.js"></script>

</body>

</html>
